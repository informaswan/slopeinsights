# Nginx reverse proxy for the SlopeInsights API, terminating TLS.
# Install to /etc/nginx/sites-available/slopeinsights-api and symlink into
# sites-enabled, then run certbot (see provision-lightsail.sh).

server {
    listen 80;
    server_name api.slopeinsights.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
