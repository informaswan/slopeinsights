# Nginx reverse proxy for the SlopeInsights API, terminating TLS.
# Install to /etc/nginx/sites-available/slopeinsights-api and symlink into
# sites-enabled, then run certbot (see provision-lightsail.sh).

server {
    listen 80;
    server_name api.slopeinsights.com;

    # JSON responses were going out uncompressed (confirmed: nginx and uvicorn both
    # skip it by default) — this is the one nginx config every deployment path hits,
    # self-hosted or not, so it's the highest-value place to fix that.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 512;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
