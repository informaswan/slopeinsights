# Nginx reverse proxy for the SlopeInsights website, terminating TLS.
# Install to /etc/nginx/sites-available/slopeinsights-web and symlink into
# sites-enabled, then run certbot (see provision-frontend-lightsail.sh).
#
# SPA routing (deep links like /resort/vail) is handled inside the frontend
# container's own nginx (app/nginx.conf), not here — this just proxies.

server {
    listen 80;
    server_name slopeinsights.com www.slopeinsights.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
