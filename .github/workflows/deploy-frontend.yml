name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Build web export
        env:
          EXPO_PUBLIC_API_URL: https://api.slopeinsights.com
          EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
        run: npx expo export --platform web --clear

      # See scripts/inject-seo-head.js — Expo's default web template has no real
      # title/description, which is also what a non-JS crawler (most AI bots) sees
      # since nothing here executes JavaScript for them.
      - name: Inject SEO/AI-crawler metadata (and Google Analytics, if configured)
        env:
          # Optional repo variable (Settings > Secrets and variables > Actions > Variables).
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node scripts/inject-seo-head.js

      # GitHub Pages runs Jekyll by default, which ignores files/folders starting
      # with "_" — Expo's JS bundles live under _expo/, so without this the site
      # would silently 404 on every asset.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # Custom domain: kept alongside the build output so it survives every deploy
      # rather than depending solely on the repo's Pages settings.
      - name: Add custom domain file
        run: echo "slopeinsights.com" > dist/CNAME

      # GitHub Pages has no server-side routing, so a direct visit to a deep link
      # like /resort/vail 404s. Serving an exact copy of index.html as 404.html
      # lets the app's own client-side router take over and render the right
      # screen; the URL bar keeps the original path.
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
