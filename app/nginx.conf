server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The JS bundle was being served uncompressed even when the browser asked for
    # gzip (confirmed directly: ~2MB either way) — this is unused in production
    # today (GitHub Pages compresses on its own), but matters if this image is
    # ever used to self-host the frontend, and there's no reason to leave it off.
    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # Single-page app: unknown paths (deep links like /resort/vail) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed bundle/assets never change once built.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
